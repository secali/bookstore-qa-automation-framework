name: bookstore-qa-sandbox

services:
  mongo:
    image: mongo:7
    container_name: bookstore-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    image: bookstore-qa-sandbox-backend:1.0.0
    pull_policy: never
    container_name: bookstore-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/bookstore
      JWT_SECRET: ${JWT_SECRET:-sandbox-super-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SEED_ADMIN_EMAIL: admin@sandbox.com
      SEED_ADMIN_PASSWORD: admin123
      SEED_ADMIN_NAME: Sandbox Admin
      SEED_SAMPLE_BOOKS: "true"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    image: bookstore-qa-sandbox-frontend:1.0.0
    pull_policy: never
    container_name: bookstore-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  mongo-data:
