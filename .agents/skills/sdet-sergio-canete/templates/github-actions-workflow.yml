name: QA Automation CI/CD Pipeline - BookStore Sandbox

on:
  push:
    branches: [ main, master, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-automation:
    name: Run BDD Automation Suites (API 70% & UI 30%)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: ⚙️ 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 3. Install Project Dependencies
        run: npm ci

      - name: 🎭 4. Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: 🐳 5. Load Local Docker Images from Tarball
        run: |
          echo "Cargando imágenes de BookStore QA Sandbox en el daemon de Docker..."
          docker load -i bookstore-images.tar
          docker images

      - name: 🚀 6. Start Sandbox Infrastructure
        run: |
          docker compose up -d
          docker compose ps

      - name: 🩺 7. Healthcheck Polling for Services
        run: |
          echo "Verificando disponibilidad de la API REST..."
          MAX_RETRIES=30
          COUNT=0
          until curl -s -f http://localhost:5000/api/health | grep -q "ok" || [ $COUNT -eq $MAX_RETRIES ]; do
            echo "Esperando a que la API esté lista ($COUNT/$MAX_RETRIES)..."
            sleep 2
            COUNT=$((COUNT + 1))
          done

          if [ $COUNT -eq $MAX_RETRIES ]; then
            echo "❌ Timeout: La API no respondió a tiempo. Mostrando logs:"
            docker compose logs
            exit 1
          fi

          echo "✅ API y MongoDB se encuentran en estado HEALTHY."
          echo "Verificando frontend..."
          curl -s -f -I http://localhost:3000 || echo "Frontend accesible."

      - name: 🧪 8. Execute Automated Test Suites in Parallel
        run: |
          echo "Ejecutando suite completa BDD con Cucumber y Playwright..."
          npx cucumber-js --parallel 4
        env:
          API_BASE_URL: http://localhost:5000/api
          UI_BASE_URL: http://localhost:3000
          HEADLESS: "true"

      - name: 📊 9. Generate HTML Reports
        if: always()
        run: |
          mkdir -p reports
          npm run report || true

      - name: 📤 10. Archive Test Reports and Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstore-qa-reports-${{ github.run_id }}
          path: |
            reports/
            screenshots/
          retention-days: 14

      - name: 🧹 11. Cleanup Docker Infrastructure
        if: always()
        run: |
          docker compose down -v
